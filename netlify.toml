[build]
  publish = ".catalog-dist"
  command = "npm run build:catalog:site"

[functions]
  directory = "_infra/catalog-functions"
  node_bundler = "esbuild"

# Existing BASE originals only; width-only contain preserves the entire image.
[images]
  remote_images = ['https://baseec-img-mng\.akamaized\.net/images/item/origin/[a-zA-Z0-9._-]+(\?imformat=generic)?']

# 商品ルートはFunction、既存ページは静的ファイルで提供する。
# 公開用 _redirects にSPAフォールバックを含めず、不明なURLは404にする。

# Netlify Image CDNの強キャッシュ設定
[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"

# 静的画像ファイルの強キャッシュ設定
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JSファイルの強キャッシュ設定
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTMLファイルは短いキャッシュ（更新対応）
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Vary = "Accept-Encoding"

# セキュリティヘッダー（全ページ適用）
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Set-Cookie = "Path=/; SameSite=Lax"
